[project]
name = "content-engine"
version = "0.1.0"
description = "A research and editing agent for LinkedIn and Medium."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "keenable>=0.1.1,<0.2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "markdown-it-py>=3,<5",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false
